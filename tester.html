<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colare Tester Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Deep teal brand frame, airy cool canvas, white work surfaces. Color lives in brand, logos, avatars and progress; tags stay quiet. */
  color-scheme: light;
  --brand:#24186B; --brand-2:#2F2287; --brand-ink:#DAD5FA;
  --bg:#F5F5F8; --surface:#FFFFFF; --hover:#F2F0FB; --ink:#1C1B22; --muted:#615F6E; --faint:#8E8C99;
  --line:#E3E2EA; --line-soft:#EEEDF3;
  --accent:#6438B1; --accent-hover:#552F99; --accent-soft:#F0EBF8; --accent-ink:#552F99;
  --ok:#22804F; --ok-soft:#E5F4EB; --warn:#A8620F; --warn-soft:#FCF1E2;
  --font:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --shadow:0 1px 2px rgba(28,27,34,.05), 0 2px 8px rgba(28,27,34,.04);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/21px var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:flex;height:100%}
.side{width:228px;flex:none;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 26px;font-weight:600;font-size:16px;color:#fff;letter-spacing:-0.01em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:#F0EBF8;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:9px;border:0;background:transparent;color:var(--brand-ink);cursor:pointer;text-align:left;width:100%;margin-bottom:2px}
.nav:hover{background:var(--brand-2);color:#fff}
.nav.on{background:#3A2BA3;color:#fff;font-weight:500}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--brand-2)}
.me b{color:#fff;font-weight:500;display:block}
.me span span{font-size:12px;color:#A9A0E6}
.main{flex:1;min-width:0;overflow:auto}
@media (max-width:860px){.side{display:none}}

/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(100,56,177,.25)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary[disabled]{background:#C6C3D3;border-color:#C6C3D3;box-shadow:none;cursor:not-allowed}
.btn.link{border:0;background:transparent;color:var(--accent-ink);padding:0 4px;height:28px}
.btn.link:hover{text-decoration:underline;background:transparent}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn.ico{width:34px;padding:0}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;color:#fff}
.av-you{background:var(--accent)}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.input{height:38px;width:100%;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea.input{height:auto;padding:9px 12px;line-height:21px;resize:vertical}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[disabled]{background:var(--bg);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:7px}
.field > label,.lbl{font-size:13px;font-weight:500}
.hint{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:#CAC8D3}
.status.ready{color:var(--ok)}
.status.ready i{background:var(--ok)}
.meta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--faint)}
.meta .ic{width:14px;height:14px}

/* progress (shared everywhere) */
.steps{display:flex;gap:4px;width:200px}
.steps i{flex:1;height:5px;border-radius:3px;background:#E3E2EA}
.steps i.on{background:var(--accent)}
.steps.live i{background:var(--ok)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog b{font-weight:500}

/* dashboard */
.page{max-width:1080px;margin:0 auto;padding:40px 36px 64px;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead h1{font-size:28px;line-height:34px;letter-spacing:-0.02em}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.fbtn:hover{color:var(--ink)}
.fbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fbtn .n{font-size:12px;opacity:.7}
.lhead,.lrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.1fr) 150px 80px 18px;align-items:center;gap:20px}
.lhead{padding:14px 22px;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line-soft)}
.lrow{padding:18px 22px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;text-align:left;cursor:pointer;width:100%}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#FAFAFC}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.who b{display:block;font-weight:600}
.who span{font-size:13px;color:var(--muted)}
.due b{display:block;font-weight:500}
.due span{font-size:12px;color:var(--muted)}
.due.soon span{color:var(--warn);font-weight:500}
.team{display:flex}
.team .avatar{border:2px solid var(--surface);margin-left:-7px}
.team .avatar:first-child{margin-left:0}
@media (max-width:760px){.lhead{display:none}.lrow{grid-template-columns:1fr;gap:10px}}

/* workspace header */
.wshead{background:var(--surface);border-bottom:1px solid var(--line)}
.wshead .in{max-width:1220px;margin:0 auto;padding:14px 36px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wshead h1{font-size:17px;line-height:22px}
.wshead .co{font-size:13px;color:var(--muted)}
.vers{position:relative}
.vbtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500}
.pop{position:absolute;top:36px;left:0;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(28,27,34,.14);padding:6px;z-index:30}
.pop button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.pop button:hover{background:var(--hover)}
.pop small{display:block;font-size:12px;color:var(--muted)}
.hprog{margin-left:auto;display:flex;align-items:center;gap:16px}
.hprog .prog{align-items:flex-end}
.hprog .prog b{font-size:13px}

/* hero row inside workspace */
.wbody{max-width:1220px;margin:0 auto;padding:28px 36px 64px;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h2{font-size:26px;line-height:32px;letter-spacing:-0.02em}
.hero p{color:var(--muted);margin-top:4px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:#ECEBF2;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .num{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#DDDBE6;color:var(--muted)}
.seg button.on .num{background:var(--accent);color:#fff}
.seg .num.done{background:var(--ok);color:#fff}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink)}
.banner .grow{flex:1}

.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
.ph h3{font-size:15px}

/* JD summary */
.jdcard{padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(var(--surface),var(--surface)) padding-box}
.jdcard .top{display:flex;align-items:center;gap:12px}
.jdcard .file{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.jdcard b{font-weight:600;display:block}
.jdcard p{font-size:13px;color:var(--muted);line-height:20px}
.skl{display:flex;flex-direction:column;gap:7px;padding-top:12px;border-top:1px solid var(--line-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--hover);font-size:12px;font-weight:500;color:var(--ink)}
.skl .row{display:flex;align-items:center;gap:9px;font-size:13px}
.skl .row .ic{width:15px;height:15px}
.skl .row.on .ic{color:var(--ok)}
.skl .row.off{color:var(--warn)}
.skl .row span:last-child{margin-left:auto;color:var(--faint);font-size:12px}
.skl .row.off span:last-child{color:var(--warn)}

/* suggestions */
.sg{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.sg + .sg{border-top:1px solid var(--line-soft)}
.sg .t{font-weight:500}
.sg .tests{font-size:13px;color:var(--muted)}
.sg .b{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.empty{padding:20px;border-radius:12px;background:var(--bg);color:var(--muted);font-size:13px;text-align:center}

/* questions */
.budget{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.budget .bar{width:120px;height:6px;border-radius:3px;background:#E3E2EA;overflow:hidden}
.budget .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.budget .bar.over i{background:var(--warn)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:box-shadow .15s}
.qcard.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.qh{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;padding:18px 20px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:14px;align-items:start}
.qn{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:600}
.qh b{font-weight:600;font-size:15px;line-height:22px;display:block}
.qh .tests{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.qh .tags{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.qh .right{display:flex;align-items:center;gap:12px;padding-top:6px}
.cbadge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:#EEE9FB;color:#5B3FB0;font-size:12px;font-weight:500}
.cbadge .ic{width:13px;height:13px}
.edited{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500}
.qe{padding:2px 20px 20px 68px;display:flex;flex-direction:column;gap:14px}
.row2{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.stepper{display:inline-flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{width:34px;height:100%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.stepper button:hover{background:var(--hover);color:var(--ink)}
.stepper button[disabled]{cursor:default;opacity:.4}
.stepper span{min-width:60px;text-align:center;font-weight:500;font-size:13px}
.attach{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 11px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:var(--surface)}
.attach .nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;font-size:13px;font-weight:500;color:var(--accent-ink);cursor:pointer}
.filebtn:hover{background:var(--accent-soft)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;font-weight:500;padding:0}
.toggle i{width:34px;height:20px;border-radius:999px;background:#D3D1DC;position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.toggle.on i{background:var(--ok)}
.toggle.on i::after{left:16px}
.toggle[disabled]{cursor:default;opacity:.6}
.thread{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.msg{display:flex;gap:10px}
.msg .body{flex:1;background:#F4F1FC;border-radius:12px;padding:10px 12px}
.msg .body .who2{font-size:12px;color:var(--muted);margin-bottom:2px}
.msg.mine .body{background:var(--accent-soft)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:1.5px dashed #CFCCDB;border-radius:14px;background:transparent;color:var(--accent-ink);font-weight:500;cursor:pointer}
.add:hover{border-color:var(--accent);background:var(--surface)}

/* rubrics */
.rsplit{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.rsplit{grid-template-columns:1fr}}
.rlist{display:flex;flex-direction:column;gap:4px}
.ri{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;width:100%}
.ri:hover{background:var(--surface)}
.ri.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.ri .qn{width:30px;height:30px;border-radius:9px;font-size:12px}
.ri b{font-weight:500;display:block;line-height:20px}
.ri small{font-size:12px;color:var(--muted)}
.ri .ok{color:var(--ok)}
.rq{padding:22px 24px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line-soft)}
.rq h3{font-size:18px;line-height:26px}
.sec{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.sec + .sec{border-top:1px solid var(--line-soft)}
.sec h4{margin:0;font-size:15px;font-weight:600}
.crit{display:flex;align-items:center;gap:10px}
.crit .num{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.addcrit{display:flex;gap:8px}
.suggest{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.suggest button{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:999px;border:1px dashed #CCC9D8;background:var(--surface);cursor:pointer;font-size:13px}
.suggest button:hover{border-color:var(--accent);color:var(--accent-ink)}
.guide{width:100%;border-collapse:separate;border-spacing:0;min-width:640px}
.guide th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:0 8px 8px}
.guide th span{display:inline-flex;align-items:center;gap:6px}
.guide th i{width:8px;height:8px;border-radius:50%}
.guide td{padding:6px 8px;vertical-align:top}
.guide td:first-child{width:24%;padding-top:14px;font-weight:500}
.cell{border:1px solid var(--line);border-radius:11px;background:var(--surface)}
.cell:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cell textarea{display:block;width:100%;border:0;padding:9px 11px 4px;resize:none;background:transparent;line-height:20px;font-size:13px;min-height:48px;border-radius:11px}
.cell textarea:focus{outline:none}
.cell .pts{display:flex;align-items:center;gap:6px;padding:2px 11px 9px;font-size:12px;color:var(--muted)}
.cell .pts input{width:46px;height:26px;border:1px solid var(--line);border-radius:7px;padding:0 6px;text-align:center;font-weight:600;background:var(--bg)}
.cell .pts input:focus{outline:none;border-color:var(--accent)}
.total{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line-soft);background:#F8F8FB;border-radius:0 0 14px 14px}
.total b{font-size:20px}

/* versions */
.ver{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.ver .top{display:flex;align-items:center;gap:10px}
.ver h3{font-size:16px}
.ver ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.ver li{display:flex;gap:10px;font-size:13px}
.ver li .ic{margin-top:2px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--hover);color:var(--muted)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(36,24,107,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 28px 70px rgba(36,24,107,.28)}
.mtop{padding:22px 24px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mtop .ttl{display:flex;align-items:center;gap:12px}
.mtop .badge{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.mtop h2{font-size:19px}
.mb{padding:18px 24px;display:flex;flex-direction:column;gap:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.person{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative}
.person:hover{border-color:#C8C5D6}
.person.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.person .avatar{width:40px;height:40px;font-size:14px}
.person b{font-weight:500;font-size:13px}
.person .tick{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.person .tick .ic{width:12px;height:12px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:460px;background:var(--surface);box-shadow:-20px 0 50px rgba(36,24,107,.16);z-index:41;display:flex;flex-direction:column}
.drawer .mb{flex:1;overflow:auto}
.jd{display:flex;flex-direction:column;gap:12px;line-height:22px}
.jd h3{font-size:14px;margin-top:6px}
.jd ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

.center{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px 80px}

.facts > div{padding:14px;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}

/* ===== Wireframe layer: titles + CTAs stay, content becomes bars ===== */
:root{--wf-1:#DCD8EF;--wf-2:#ECEAF6;--wf-line:#DCD8EF}
/* single-line content -> bar */
.sg .t,.qh b,.jdcard .top b,.who b,.ri b,.rq h3,.vh + b,.hist b{
  display:block;color:transparent!important;background:var(--wf-1);border-radius:4px;height:12px;line-height:12px;overflow:hidden;width:72%;margin:4px 0;user-select:none}
.sg .tests,.qh .tests,.jdcard .top .hint,.who span,.ri small{
  display:block;color:transparent!important;background:var(--wf-2);border-radius:4px;height:9px;line-height:9px;overflow:hidden;width:48%;margin:8px 0 2px;user-select:none}
.sg:nth-child(2n) .t,.qcard:nth-child(2n) .qh b{width:58%}
.sg:nth-child(3n) .t,.qcard:nth-child(3n) .qh b{width:80%}
.sg:nth-child(2n) .tests,.qcard:nth-child(2n) .qh .tests{width:36%}
/* paragraphs -> stacked bars */
.jdcard p,.rq p,.hist p,.cm .body,.msg .body{
  color:transparent!important;user-select:none;line-height:20px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 6px,var(--wf-2) 6px 14px,transparent 14px 20px)!important;background-color:transparent!important}
.cm .body .who2{color:var(--muted)!important;background:none}
/* chips -> empty outlines */
.chips span{color:transparent!important;background:#fff!important;border:1px dashed var(--wf-line);user-select:none}
/* fields: keep label, value becomes a bar */
.qe .input,.crit .input,.addcrit .input,.guide textarea,.cell textarea{color:transparent!important;caret-color:transparent}
.qe .input::placeholder,.addcrit .input::placeholder,.cell textarea::placeholder{color:transparent}
.qe input.input,.crit .input{background:#fff linear-gradient(var(--wf-2),var(--wf-2)) 12px 50%/55% 9px no-repeat}
.qe textarea.input,.cell textarea{background:#fff repeating-linear-gradient(to bottom,transparent 0 15px,var(--wf-2) 15px 23px,transparent 23px 29px) 12px 0/80% 100% no-repeat}
.guide td:first-child{color:transparent;background:linear-gradient(var(--wf-1),var(--wf-1)) 14px 50%/60% 10px no-repeat}
/* reference file name -> bar, icon stays */
.attach .nm{color:transparent!important;background:var(--wf-2);border-radius:4px;height:9px;align-self:center}
/* trim helper text */
.ph .meta,.jdcard .skl > .hint{display:none}

.recrow{display:flex;align-items:center;gap:10px;min-height:66px;padding:0 4px}
.recrow .wave{flex:1}
/* panel wireframe */
.qhead2 p,.anote span{color:transparent!important;user-select:none;line-height:20px;background-image:repeating-linear-gradient(to bottom,transparent 0 6px,var(--wf-2) 6px 14px,transparent 14px 20px)}

.savedc p,.cnote p{color:transparent!important;background-image:repeating-linear-gradient(to bottom,transparent 0 6px,var(--wf-2) 6px 14px,transparent 14px 20px)}

.wfb{display:inline-block;width:70px;height:9px;border-radius:4px;background:var(--wf-2)}

.fbc textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

const CO = { aster: 'Aster Orbital', halden: 'Halden Robotics', corvid: 'Corvid Motion', ferrell: 'Ferrell Works' };
/* ---------- helpers ---------- */

const Q = (id) => S.qs.find((x) => x.id === id);
const V = () => 'v' + S.version;
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const logo = (k, size) => `<span class="logo" style="background:${LOGOS[k].bg};color:${LOGOS[k].fg};${size ? `width:${size}px;height:${size}px` : ''}" title="${CO[k]}">${LOGOS[k].svg}</span>`;

const ini = (n) => n.split(' ').map((w) => w[0]).join('');

function portPos(id, side) {
  const el = $('#canvas'); const p = el && el.querySelector(`.port.${side}[data-node="${id}"]`);
  if (!p) return null;
  const a = el.getBoundingClientRect(); const b = p.getBoundingClientRect();
  return { x: b.left - a.left + b.width / 2, y: b.top - a.top + b.height / 2 };
}
const curve = (a, b) => { const dx = Math.max(40, Math.abs(b.x - a.x) / 2); return `M${a.x} ${a.y} C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`; };

/* pointer handling: drag parts, drag from an out-dot to an in-dot to connect */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const canvas = e.target.closest('#canvas'); if (!canvas) return;
  const port = e.target.closest('.port');
  const node = e.target.closest('.node');
  if (port && port.dataset.port === 'out') {
    e.preventDefault();
    drag = { mode: 'wire', from: port.dataset.node };
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (node && !e.target.closest('.nl')) {
    const n = cv().nodes.find((m) => m.id === node.dataset.node);
    S.sel = n.id;
    canvas.querySelectorAll('.node').forEach((d) => d.classList.toggle('sel', d === node));
    const del = document.querySelector('[data-act="delnode"]'); if (del) del.disabled = false;
    drag = { mode: 'move', n, el: node, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y };
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  if (!node && !e.target.closest('path')) {
    S.sel = null;
    canvas.querySelectorAll('.node.sel').forEach((d) => d.classList.remove('sel'));
    const del = document.querySelector('[data-act="delnode"]'); if (del) del.disabled = true;
  }
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const canvas = $('#canvas'); if (!canvas) return;
  if (drag.mode === 'move') {
    const r = canvas.getBoundingClientRect();
    drag.n.x = Math.max(8, Math.min(r.width - drag.el.offsetWidth - 8, drag.ox + e.clientX - drag.sx));
    drag.n.y = Math.max(8, Math.min(r.height - drag.el.offsetHeight - 8, drag.oy + e.clientY - drag.sy));
    drag.el.style.left = drag.n.x + 'px'; drag.el.style.top = drag.n.y + 'px';
    drawLinks();
  } else {
    const r = canvas.getBoundingClientRect();
    drawLinks({ a: portPos(drag.from, 'out'), b: { x: e.clientX - r.left, y: e.clientY - r.top } });
  }
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  if (drag.mode === 'wire') {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const tgt = hit && (hit.closest('.port.in') || hit.closest('.node'));
    const to = tgt && tgt.dataset.node;
    const c = cv();
    if (to && to !== drag.from && !c.links.some(([a, b]) => a === drag.from && b === to)) c.links.push([drag.from, to]);
    drawLinks();
  }
  drag = null;
});
document.addEventListener('click', (e) => {
  const p = e.target.closest('#links path[data-link]');
  if (p) { cv().links.splice(Number(p.dataset.link), 1); drawLinks(); }
});
document.addEventListener('input', (e) => {

});

document.addEventListener('dragover', (e) => { if (e.target.closest('#canvas')) e.preventDefault(); });

/* timers */
setInterval(() => {
  const rt = $('#rect'); if (rt && S.rec) rt.textContent = mmss(Math.floor((Date.now() - S.rec.start) / 1000));
  if (S.screen !== 'test' || S.checking) return;
  const x = S.qs[idx()];
  S.times[x.id] = spent(x.id) + 1;
  const el = $('#tval'); if (!el) return;
  if (S.type === 'untimed') el.textContent = mmss(spent(x.id));
  else if (S.type === 'timed') el.textContent = mmss(Math.max(0, x.min * 60 - spent(x.id)));
  else el.textContent = mmss(Math.max(0, total() * 60 - S.qs.reduce((a, y) => a + spent(y.id), 0)));
}, 1000);

function go(dir) {
  const k = idx() + dir;
  if (k < 0) return;
  if (k >= S.qs.length) { S.screen = 'done'; return; }
  S.cur = S.qs[k].id; S.sel = null; S.reportOpen = false;
}
const A = {
  start: () => { S.screen = 'test'; S.cur = 'w0'; },
  type: (id) => { S.type = id; },
  amode: (id) => { S.amode = id; },
  recstart: () => { S.rec = { qid: S.cur, start: Date.now() }; },
  recstop: () => { if (!S.rec) return; S.voice[S.rec.qid] = Math.max(3, Math.floor((Date.now() - S.rec.start) / 1000)); S.rec = null; toast('Recording saved'); },
  recdel: () => { delete S.voice[S.cur]; },
  attach: () => { S.files[S.cur] = true; },
  rmfile: () => { delete S.files[S.cur]; },
  fit: () => toast('View reset'),
  play: () => toast('Playing recording'),
  reportopen: () => { S.reportOpen = true; },
  report: () => { S.reported[S.cur] = true; S.reportOpen = false; },
  prev: () => go(-1),
  next: () => { if (S.rec) A.recstop(); S.seen[S.cur] = true; if (S.type === 'e2e') go(1); else S.checking = S.cur; },
  goq: (id) => { S.seen[S.cur] = true; S.cur = id; S.sel = null; S.checking = null; S.reportOpen = false; },
  fb: (id, el) => { S.fb[id] = { ...(S.fb[id] || {}), [el.dataset.k]: el.dataset.v }; },
  aftercheck: () => { S.checking = null; go(1); },
  skipcheck: () => { S.checking = null; go(1); },
  submit: () => { S.screen = 'done'; },
  addnode: (id) => { addNode(id); },
  delnode: () => { const c = cv(); c.nodes = c.nodes.filter((n) => n.id !== S.sel); c.links = c.links.filter(([a, b]) => a !== S.sel && b !== S.sel); S.sel = null; },
  resetcv: () => { delete S.canvas[S.cur]; S.sel = null; }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.id, el); render();
});
document.addEventListener('input', (e) => { if (e.target.dataset.field === 'ans') S.answers[e.target.dataset.id] = e.target.value; if (e.target.dataset.field === 'fbt') S.fbtext[e.target.dataset.id] = e.target.value; });
document.addEventListener('keydown', (e) => {
  const typing = e.target.closest && e.target.closest('input,textarea,[contenteditable="true"]');
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel && !typing && $('#canvas')) { e.preventDefault(); A.delnode(); render(); }
});
if (window.self !== window.top) document.body.classList.add('embed');
render();
</script>
</body>
</html>
